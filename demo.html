<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission 1 Demo</title>
<style>body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:#eef8e9;margin:0;padding:24px;color:#234}.card{max-width:520px;margin:auto;background:#fff;border:3px solid #5cae55;border-radius:24px;padding:20px;box-shadow:0 12px 35px #0002}h1{text-align:center;color:#267642}.q{background:#fff5cc;border:2px solid #f1c232;border-radius:16px;padding:16px;font-size:20px;font-weight:800;text-align:center}button{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:2px solid #9ad18f;background:#eaf7e8;font-size:18px;font-weight:800}#f{display:none;margin-top:12px;padding:12px;border-radius:14px;text-align:center;font-weight:900}</style></head>
<body><div class="card"><h1>🌱 AR Farm Tool Hero</h1><div class="q">ฉันมีด้ามยาว ใช้พรวนและถากดิน ฉันคืออะไร?</div><button onclick="a('A')">A. จอบ</button><button onclick="a('B')">B. คราด</button><button onclick="a('C')">C. บัวรดน้ำ</button><div id="f"></div></div>
<script>function a(x){let f=document.getElementById('f');f.style.display='block';if(x==='A'){f.style.background='#daf5d5';f.style.color='#1d6b31';f.innerHTML='🎉 เก่งมาก! คำตอบถูกต้อง<br>จอบใช้พรวนและถากดิน';}else{f.style.background='#fff0db';f.style.color='#9a4d00';f.innerHTML='💡 ยังไม่ถูกนะ ลองอีกครั้ง';}}</script></body></html>
